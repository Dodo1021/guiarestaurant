version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guiarestaurant
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: guiarestaurant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://guiarestaurant:changeme@postgres:5432/guiarestaurant
      NEXTAUTH_SECRET: your-secret-key-change-in-production
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      - postgres
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  postgres_data:
